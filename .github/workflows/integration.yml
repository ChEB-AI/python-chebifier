name: Integration tests

on:
  workflow_dispatch:
  push:
    paths: &integration-paths
      - "chebifier/prediction_models/**"
      - "chebifier/__init__.py"
      - "chebifier/_custom_cache.py"
      - "chebifier/cli.py"
      - "chebifier/hugging_face.py"
      - "chebifier/predict.py"
      - "chebifier/utils.py"
      - "chebifier/*.yml"
      - "pyproject.toml"
      - "tests/test_predictor_integration.py"
      - ".github/workflows/integration.yml"
  pull_request:
    paths: *integration-paths

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ hashFiles('tests/test_predictor_integration.py') }}
          restore-keys: huggingface-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.0 torch_scatter torch_geometric --extra-index-url https://download.pytorch.org/whl/cpu -f https://data.pyg.org/whl/torch-2.12.0+cpu.html
          pip install -e .[models] pytest

      - name: Download ChEBI graph
        run: python -c "from huggingface_hub import hf_hub_download; hf_hub_download('chebai/chebifier', 'chebi_graph_v252.pkl', repo_type='dataset', local_dir='data')"

      - name: Run integration tests
        env:
          CHEBIFIER_INTEGRATION: "1"
        run: pytest tests/test_predictor_integration.py
